name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Newest commit on main wins. This was `cancel-in-progress: false` (the value
# in GitHub's starter workflow, meant to avoid interrupting a publish), but
# that starves the queue: when one run sat in `queued` for 19 minutes waiting
# on a runner, three merges behind it never deployed at all — the site simply
# stopped updating. An older run is obsolete the moment a newer commit lands,
# so superseding it is both safe and what we actually want; if a publish is
# ever cut short, the newer run republishes seconds later.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The build normally finishes in under a minute. Without a bound, a hung
    # step would hold the `pages` concurrency group for GitHub's 6-hour
    # default and block every later deploy behind it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Exposes the resolved Pages URL (steps.pages.outputs.base_url) so the
      # build can bake correct canonical/OG URLs.
      #
      # enablement: true asserts the Pages *source* on every run. If the repo's
      # Pages source is ever left on "Deploy from a branch", GitHub's built-in
      # Jekyll builder (the `pages-build-deployment` workflow) renders README.md
      # and races this Actions deploy for the github-pages environment — so the
      # published site flickers to the raw README instead of the Next.js app.
      # Forcing build_type "workflow" here keeps GitHub Actions the sole source
      # and stops the Jekyll README from ever winning. If you also see the README
      # live, flip Settings -> Pages -> "Build and deployment" -> Source to
      # "GitHub Actions" once; this step keeps it there afterwards.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Derive the URL path prefix from the actual Pages base URL.
      # - github.io deploy: base_url = https://<user>.github.io/<repo>  -> /<repo>
      # - custom domain:    base_url = https://example.com              -> "" (empty)
      # Hardcoding /<repo> broke the site once a CNAME was attached: every
      # asset URL became /<repo>/_next/... and 404'd on the custom domain,
      # leaving only unstyled HTML text.
      - name: Derive base path from Pages URL
        id: basepath
        run: |
          url="${{ steps.pages.outputs.base_url }}"
          path=$(printf '%s' "$url" | sed -E 's|^https?://[^/]+||; s|/$||')
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build static export
        env:
          # Empty on a custom domain, /<repo> on github.io — whichever is
          # actually correct for this deployment's URL.
          NEXT_PUBLIC_BASE_PATH: ""
          # Keeps canonical tags / sitemap / OG URLs pointing at where the
          # site actually lives. Replace with the real domain once one is
          # attached.
          NEXT_PUBLIC_SITE_URL: https://www.alcon-online.site
          # Optional: set a repo variable of the same name to point the
          # quote form at Formspree/Web3Forms/etc. Without it the form
          # falls back to a pre-filled email instead of faking a send.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Publishing normally takes seconds, but Pages has stalled in
    # `updating_pages` for the full 10 minutes at least once, and the
    # published site is ~99 MB (four hero video encodes), which is slow to
    # distribute. Both the action's own timeout and this job's used to expire
    # together at 10 minutes, cancelling a deploy whose artifact had built
    # fine and leaving the site a commit behind. Give Pages room, and keep
    # the job's ceiling above the action's so the action reports the real
    # error instead of being killed mid-poll.
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000 # 20 minutes, up from the 10-minute default

      # The environment URL above only renders as a link on the run page and
      # in the repo's Deployments panel, both of which are easy to miss (and
      # show nothing at all for a run that was cancelled or superseded).
      # Writing it to the run summary means every successful deploy carries a
      # clickable link on its own page, whatever the environment badge does.
      - name: Report deployed URL
        run: |
          {
            echo "### Deployed to GitHub Pages"
            echo
            echo "- **URL:** ${{ steps.deployment.outputs.page_url }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
