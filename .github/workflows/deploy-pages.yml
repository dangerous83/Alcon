name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Exposes the resolved Pages URL (steps.pages.outputs.base_url) so the
      # build can bake correct canonical/OG URLs.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        env:
          # The site is served from https://<user>.github.io/<repo>, so
          # assets and links need the repo-name prefix. Delete this (and
          # the basePath in next.config.ts picks up "") when moving to a
          # custom domain served at the root.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Keeps canonical tags / sitemap / OG URLs pointing at where the
          # site actually lives. Replace with the real domain once one is
          # attached.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional: set a repo variable of the same name to point the
          # quote form at Formspree/Web3Forms/etc. Without it the form
          # falls back to a pre-filled email instead of faking a send.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_FORM_ENDPOINT }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
